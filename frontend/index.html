<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />

    <!-- 百度统计（透過环境变量 VITE_BAIDU_TONGJI_ID 注入，未配置则不显示） -->
    <script type="text/javascript">
      window.__BAIDU_TONGJI_ID__ = '__BAIDU_TONGJI_ID__';
      (function () {
        var id = window.__BAIDU_TONGJI_ID__;
        if (!id) return;
        var hm = document.createElement('script');
        hm.src = 'https://hm.baidu.com/hm.js?' + id;
        var s = document.getElementsByTagName('script')[0];
        s.parentNode.insertBefore(hm, s);
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
