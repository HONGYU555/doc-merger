<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>doc-merger — Word/TXT 批次合併工具</title>
<!-- CDN libs: mammoth 用來解析 .docx，JSZip 用來產生 .docx 輸出 -->
<script src="https://cdn.jsdelivr.net/npm/mammoth@1.8.0/mammoth.browser.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<style>
:root {
  --color-bg:#f5f7fb;--color-surface:#fff;--color-border:#e5e7eb;
  --color-text:#1f2937;--color-text-muted:#6b7280;
  --color-primary:#2563eb;--color-primary-hover:#1d4ed8;--color-primary-soft:#dbeafe;
  --color-success:#16a34a;--color-danger:#dc2626;
  --color-ad-bg:#f0f0f0;--color-ad-border:#d1d5db;--color-ad-text:#6b7280;
  --radius-md:10px;--radius-lg:14px;
  --shadow-sm:0 1px 2px rgba(0,0,0,.04);
  --font-stack:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;font-family:var(--font-stack);background:var(--color-bg);color:var(--color-text);font-size:15px;line-height:1.6}
body{min-height:100vh;display:flex;flex-direction:column}

/* 廣告位 */
.ad-slot{background:var(--color-ad-bg);border:2px dashed var(--color-ad-border);border-radius:var(--radius-md);display:flex;align-items:center;justify-content:center;color:var(--color-ad-text);font-size:13px;letter-spacing:.5px}
.ad-top-banner{width:100%;min-height:90px;margin:16px auto 0;max-width:1200px}
.ad-sidebar{position:absolute;top:0;right:24px;width:220px;min-height:280px}
.ad-action-below{min-height:100px;margin:16px 0}
.ad-footer{width:100%;min-height:80px;margin-top:32px}
.ad-label{font-weight:500}

/* Header */
.app-header{background:var(--color-surface);border-bottom:1px solid var(--color-border);padding:16px 32px;display:flex;align-items:center;justify-content:space-between;box-shadow:var(--shadow-sm)}
.brand{display:flex;align-items:center;gap:14px}
.brand-logo{font-size:32px;width:48px;height:48px;background:var(--color-primary-soft);border-radius:var(--radius-md);display:flex;align-items:center;justify-content:center}
.brand h1{margin:0;font-size:20px;font-weight:700}
.brand-sub{margin:0;font-size:13px;color:var(--color-text-muted)}
.stat-pill{background:var(--color-primary-soft);color:var(--color-primary);padding:8px 16px;border-radius:999px;font-weight:600;font-size:14px}
.stat-pill .stat-num{font-size:18px}

/* Main */
.app-main{width:100%;max-width:1200px;margin:0 auto;padding:32px;position:relative;flex:1}
.workspace{max-width:820px;margin:0 auto;position:relative}

.card{background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-lg);padding:24px;margin-bottom:24px;box-shadow:var(--shadow-sm)}
.card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.card-header h2{margin:0;font-size:16px;font-weight:600}
.hint{font-size:13px;color:var(--color-text-muted)}
.hint code{background:var(--color-bg);padding:2px 6px;border-radius:4px;font-size:12px;color:var(--color-primary)}
.link-btn{background:transparent;border:none;color:var(--color-primary);cursor:pointer;font-size:14px;padding:4px 8px;border-radius:4px}
.link-btn:hover{background:var(--color-primary-soft)}

.dropzone{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:48px 24px;border:2px dashed var(--color-border);border-radius:var(--radius-lg);cursor:pointer;transition:all .2s;text-align:center;background:var(--color-bg)}
.dropzone:hover,.dropzone.is-dragging{border-color:var(--color-primary);background:var(--color-primary-soft)}
.dropzone.is-disabled{opacity:.5;cursor:not-allowed}
.dropzone-icon{font-size:48px;color:var(--color-primary);margin-bottom:12px}
.dropzone-text{display:flex;flex-direction:column;gap:4px}
.dropzone-text strong{font-size:18px}
.dropzone-text span{font-size:14px;color:var(--color-text-muted)}
.dropzone-text u{color:var(--color-primary)}
.dropzone small{margin-top:12px;color:var(--color-text-muted);font-size:12px}

.file-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.file-item{display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--color-bg);border:1px solid var(--color-border);border-radius:var(--radius-md);cursor:grab;transition:all .15s}
.file-item:hover{border-color:var(--color-primary);background:var(--color-surface)}
.file-item.is-dragging{opacity:.4;cursor:grabbing}
.file-item .drag-handle{color:var(--color-text-muted);font-size:18px;cursor:grab}
.file-item .file-icon{font-size:24px}
.file-item .file-info{flex:1;min-width:0}
.file-item .file-name{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.file-item .file-meta{font-size:12px;color:var(--color-text-muted)}
.file-item .remove-btn{background:transparent;border:none;color:var(--color-danger);cursor:pointer;padding:4px 10px;border-radius:6px;font-size:16px}
.file-item .remove-btn:hover{background:#fee2e2}
.empty-state{padding:32px;text-align:center;color:var(--color-text-muted)}

.form-row{margin-bottom:20px}
.form-row:last-child{margin-bottom:0}
.form-label{display:block;font-weight:500;margin-bottom:10px}
.radio-group{display:flex;flex-wrap:wrap;gap:8px}
.radio-pill{position:relative;cursor:pointer;user-select:none}
.radio-pill input{position:absolute;opacity:0;pointer-events:none}
.radio-pill span{display:inline-block;padding:8px 16px;border:1px solid var(--color-border);border-radius:999px;background:var(--color-surface);font-size:14px;transition:all .15s}
.radio-pill:hover span{border-color:var(--color-primary)}
.radio-pill input:checked+span{background:var(--color-primary);color:#fff;border-color:var(--color-primary)}
.text-input{width:100%;padding:10px 14px;border:1px solid var(--color-border);border-radius:var(--radius-md);font-size:14px;font-family:var(--font-stack);margin-top:8px}
.text-input:focus{outline:none;border-color:var(--color-primary);box-shadow:0 0 0 3px var(--color-primary-soft)}

.primary-btn{background:var(--color-primary);color:#fff;border:none;padding:14px 32px;font-size:16px;font-weight:600;border-radius:var(--radius-md);cursor:pointer;font-family:var(--font-stack);display:inline-flex;align-items:center;justify-content:center;gap:10px;min-width:200px;text-decoration:none;transition:background .15s}
.primary-btn:hover:not(:disabled){background:var(--color-primary-hover)}
.primary-btn:disabled{background:#cbd5e1;cursor:not-allowed}
.btn-spinner{width:16px;height:16px;border:2px solid #fff;border-top-color:transparent;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.muted{color:var(--color-text-muted);font-size:13px;margin:8px 0 0;text-align:center}

.merge-zone{display:flex;flex-direction:column;align-items:center;margin:32px 0}
.download-btn{display:inline-flex;margin-top:12px}

.app-footer{text-align:center;padding:24px;color:var(--color-text-muted);font-size:12px;background:var(--color-surface);border-top:1px solid var(--color-border)}
.app-footer p{margin:4px 0}

/* toast */
.toast{position:fixed;top:24px;left:50%;transform:translateX(-50%);background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-md);padding:12px 20px;box-shadow:var(--shadow-sm);z-index:9999;max-width:480px;font-size:14px}
.toast.success{border-color:var(--color-success);color:var(--color-success)}
.toast.error{border-color:var(--color-danger);color:var(--color-danger)}
.toast.warn{border-color:#d97706;color:#d97706}

@media (max-width:1024px){.ad-sidebar{display:none}}
@media (max-width:640px){
  .app-header{padding:12px 16px;flex-direction:column;gap:12px;align-items:flex-start}
  .app-main{padding:16px}
  .card{padding:16px}
  .dropzone{padding:32px 16px}
  .ad-top-banner,.ad-footer{min-height:60px}
}
</style>
</head>
<body>

<!-- 廣告位 #1：頂部 banner -->
<div class="ad-slot ad-top-banner" data-position="top-banner">
  <span class="ad-label">廣告位 #1 · 頂部 banner</span>
</div>

<header class="app-header">
  <div class="brand">
    <span class="brand-logo">📄</span>
    <div>
      <h1>doc-merger</h1>
      <p class="brand-sub">Word / TXT 批次合併工具</p>
    </div>
  </div>
  <div class="header-stats">
    <span class="stat-pill"><span class="stat-num" id="fileCount">0</span> / 50 個檔案</span>
  </div>
</header>

<main class="app-main">
  <section class="workspace">
    <!-- 廣告位 #2：側欄 -->
    <div class="ad-slot ad-sidebar" data-position="sidebar">
      <span class="ad-label">廣告位 #2 · 側欄</span>
    </div>

    <div class="card">
      <div class="card-header">
        <h2>① 上傳檔案</h2>
        <span class="hint">支援 <code>.docx</code> 與 <code>.txt</code> 混合上傳</span>
      </div>
      <label id="dropzone" class="dropzone" for="fileInput">
        <div class="dropzone-icon">⬆</div>
        <div class="dropzone-text">
          <strong>拖拽檔案到此處</strong>
          <span>或 <u>點擊選擇檔案</u></span>
        </div>
        <small>單次最多 50 個檔案，每檔 ≤ 10MB</small>
        <input id="fileInput" type="file" accept=".docx,.txt" multiple hidden />
      </label>
    </div>

    <div class="card">
      <div class="card-header">
        <h2>② 排序檔案（合併順序）</h2>
        <button class="link-btn" id="clearAll" hidden>清空全部</button>
      </div>
      <ul id="fileList" class="file-list"></ul>
      <div id="emptyState" class="empty-state">
        <p>尚未選擇任何檔案</p>
      </div>
    </div>

    <div class="card">
      <div class="card-header"><h2>③ 合併選項</h2></div>
      <div class="form-row">
        <label class="form-label">分隔符</label>
        <div class="radio-group" id="separatorGroup">
          <label class="radio-pill"><input type="radio" name="separator" value="newline" checked /><span>兩個換行</span></label>
          <label class="radio-pill"><input type="radio" name="separator" value="page" /><span>分頁符</span></label>
          <label class="radio-pill"><input type="radio" name="separator" value="custom" /><span>自訂字串</span></label>
        </div>
        <input id="customSeparator" class="text-input" type="text" placeholder="輸入自訂分隔字串…" hidden />
      </div>
      <div class="form-row">
        <label class="form-label">輸出格式</label>
        <div class="radio-group">
          <label class="radio-pill"><input type="radio" name="format" value="docx" checked /><span>Word (.docx)</span></label>
          <label class="radio-pill"><input type="radio" name="format" value="txt" /><span>TXT (.txt)</span></label>
        </div>
      </div>
    </div>

    <div class="merge-zone">
      <button id="mergeBtn" class="primary-btn" disabled>
        <span class="btn-label">合併檔案</span>
        <span class="btn-spinner" id="btnSpinner" hidden></span>
      </button>
      <p id="mergeHint" class="muted">請先上傳至少一個檔案</p>
    </div>

    <!-- 廣告位 #3：合併按鈕下方 -->
    <div class="ad-slot ad-action-below" data-position="action-below">
      <span class="ad-label">廣告位 #3 · 合併按鈕下方</span>
    </div>

    <div id="resultCard" class="card" hidden>
      <div class="card-header">
        <h2>④ 下載結果</h2>
      </div>
      <p id="resultText" style="margin:0 0 8px"></p>
      <a id="downloadLink" class="primary-btn download-btn" download>⬇ 下載合併檔</a>
    </div>
  </section>
</main>

<!-- 廣告位 #4：頁面底部 -->
<div class="ad-slot ad-footer" data-position="footer">
  <span class="ad-label">廣告位 #4 · 頁面底部</span>
</div>

<footer class="app-footer">
  <p>doc-merger · 部署於 ICP 備案老域名 · 廣告由百度聯盟提供</p>
  <p>純前端單檔版 · 雙擊 HTML 直接使用</p>
</footer>

<script>
'use strict';

// ============================================
// 狀態
// ============================================
const MAX_FILES = 50;
const MAX_FILE_SIZE = 10 * 1024 * 1024; // 10MB
const ACCEPTED_EXTS = ['.docx', '.txt'];
let files = []; // [{ id, buffer, name, ext, size, type }]

// ============================================
// DOM
// ============================================
const $ = (id) => document.getElementById(id);
const dropzone = $('dropzone');
const fileInput = $('fileInput');
const fileList = $('fileList');
const emptyState = $('emptyState');
const fileCountEl = $('fileCount');
const clearAllBtn = $('clearAll');
const mergeBtn = $('mergeBtn');
const btnSpinner = $('btnSpinner');
const mergeHint = $('mergeHint');
const customSepInput = $('customSeparator');
const resultCard = $('resultCard');
const resultText = $('resultText');
const downloadLink = $('downloadLink');

// ============================================
// 工具
// ============================================
const fmtSize = (b) => {
  if (b < 1024) return b + ' B';
  if (b < 1024 * 1024) return (b / 1024).toFixed(1) + ' KB';
  return (b / 1024 / 1024).toFixed(2) + ' MB';
};
const ext = (name) => name.toLowerCase().slice(name.lastIndexOf('.'));
const icon = (e) => (e === '.docx' ? '📘' : '📄');
const escapeHtml = (s) =>
  String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

function toast(msg, type = 'info') {
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 3000);
}

// ============================================
// 上傳
// ============================================
dropzone.addEventListener('click', () => {
  if (files.length >= MAX_FILES) return;
  fileInput.click();
});

['dragenter', 'dragover'].forEach((ev) =>
  dropzone.addEventListener(ev, (e) => {
    e.preventDefault();
    if (files.length >= MAX_FILES) return;
    dropzone.classList.add('is-dragging');
  })
);
['dragleave', 'drop'].forEach((ev) =>
  dropzone.addEventListener(ev, (e) => {
    e.preventDefault();
    dropzone.classList.remove('is-dragging');
  })
);
dropzone.addEventListener('drop', (e) => {
  const dropped = Array.from(e.dataTransfer.files || []);
  addFiles(dropped);
});
fileInput.addEventListener('change', (e) => {
  addFiles(Array.from(e.target.files || []));
  fileInput.value = '';
});

async function addFiles(newFiles) {
  const remaining = MAX_FILES - files.length;
  if (remaining <= 0) {
    toast(`最多只能上傳 ${MAX_FILES} 個檔案`, 'warn');
    return;
  }
  let added = 0, skipped = 0;
  for (const f of newFiles) {
    if (added >= remaining) break;
    const e = ext(f.name);
    if (!ACCEPTED_EXTS.includes(e)) {
      skipped++;
      continue;
    }
    if (f.size > MAX_FILE_SIZE) {
      toast(`檔案 ${f.name} 超過 10MB 上限`, 'warn');
      continue;
    }
    // 在新增時就把檔案讀成 ArrayBuffer 儲存，後續不需重新讀
    let buffer;
    try {
      if (typeof f.arrayBuffer === 'function') {
        buffer = await f.arrayBuffer();
      } else {
        buffer = await new Promise((res, rej) => {
          const r = new FileReader();
          r.onload = () => res(r.result);
          r.onerror = () => rej(r.error);
          r.readAsArrayBuffer(f);
        });
      }
    } catch (err) {
      console.error('讀取檔案失敗:', f.name, err);
      toast(`讀取 ${f.name} 失敗`, 'error');
      continue;
    }
    files.push({
      id: crypto.randomUUID(),
      buffer,
      name: f.name,
      ext: e,
      size: f.size,
    });
    added++;
  }
  if (skipped > 0) {
    toast(`已跳過 ${skipped} 個不支援的檔案（僅接受 .docx / .txt）`, 'warn');
  }
  render();
}

// ============================================
// 列表渲染
// ============================================
function render() {
  fileCountEl.textContent = files.length;
  fileList.innerHTML = '';
  if (files.length === 0) {
    emptyState.hidden = false;
    clearAllBtn.hidden = true;
    mergeBtn.disabled = true;
    mergeHint.textContent = '請先上傳至少一個檔案';
    return;
  }
  emptyState.hidden = true;
  clearAllBtn.hidden = false;
  mergeBtn.disabled = false;
  mergeHint.textContent = `準備合併 ${files.length} 個檔案`;

  files.forEach((f, idx) => {
    const li = document.createElement('li');
    li.className = 'file-item';
    li.draggable = true;
    li.dataset.id = f.id;
    li.innerHTML = `
      <span class="drag-handle" title="拖曳排序">⋮⋮</span>
      <span class="file-icon">${icon(f.ext)}</span>
      <div class="file-info">
        <div class="file-name">${idx + 1}. ${escapeHtml(f.name)}</div>
        <div class="file-meta">${f.ext.toUpperCase()} · ${fmtSize(f.size)}</div>
      </div>
      <button class="remove-btn" data-id="${f.id}" title="移除">✕</button>
    `;
    fileList.appendChild(li);
  });
}

fileList.addEventListener('click', (e) => {
  const btn = e.target.closest('.remove-btn');
  if (!btn) return;
  files = files.filter((f) => f.id !== btn.dataset.id);
  resultCard.hidden = true;
  render();
});

clearAllBtn.addEventListener('click', () => {
  files = [];
  resultCard.hidden = true;
  render();
});

// ============================================
// 拖曳排序
// ============================================
let dragSrcId = null;
fileList.addEventListener('dragstart', (e) => {
  const item = e.target.closest('.file-item');
  if (!item) return;
  dragSrcId = item.dataset.id;
  item.classList.add('is-dragging');
  e.dataTransfer.effectAllowed = 'move';
});
fileList.addEventListener('dragend', (e) => {
  const item = e.target.closest('.file-item');
  if (item) item.classList.remove('is-dragging');
  dragSrcId = null;
});
fileList.addEventListener('dragover', (e) => {
  e.preventDefault();
  const item = e.target.closest('.file-item');
  if (!item || item.dataset.id === dragSrcId) return;
  const rect = item.getBoundingClientRect();
  const after = e.clientY > rect.top + rect.height / 2;
  const srcEl = document.querySelector(`[data-id="${dragSrcId}"]`);
  if (!srcEl) return;
  if (after) item.parentNode.insertBefore(srcEl, item.nextSibling);
  else item.parentNode.insertBefore(srcEl, item);
});
fileList.addEventListener('drop', (e) => {
  e.preventDefault();
  if (!dragSrcId) return;
  const orderedIds = Array.from(fileList.querySelectorAll('.file-item')).map((el) => el.dataset.id);
  files = orderedIds.map((id) => files.find((f) => f.id === id)).filter(Boolean);
  dragSrcId = null;
  render();
});

// 自訂分隔符切換
document.querySelectorAll('input[name="separator"]').forEach((r) => {
  r.addEventListener('change', () => {
    customSepInput.hidden = r.value !== 'custom' || !r.checked;
  });
});

// ============================================
// 文字抽取（TXT 與 docx）
// ============================================
async function readAsText(stored) {
  const e = stored.ext;
  const buf = stored.buffer;
  if (e === '.txt') {
    const dec = new TextDecoder('utf-8', { fatal: false });
    let text = dec.decode(buf);
    // 若有大量 replacement char，嘗試 GBK
    if (text.length > 0 && (text.match(/\uFFFD/g) || []).length / text.length > 0.01) {
      try {
        text = new TextDecoder('gbk').decode(buf);
      } catch (_) {
        /* ignore */
      }
    }
    return text;
  }
  if (e === '.docx') {
    const result = await mammoth.extractRawText({ arrayBuffer: buf });
    return result.value;
  }
  throw new Error('不支援的類型: ' + e);
}

// ============================================
// 分隔符處理
// ============================================
function buildSeparator() {
  const sel = document.querySelector('input[name="separator"]:checked').value;
  if (sel === 'page') return { type: 'page' };
  if (sel === 'custom') return { type: 'text', value: customSepInput.value };
  return { type: 'text', value: '\n\n' };
}

// ============================================
// 合併：純文字層
// ============================================
async function extractAll() {
  return Promise.all(files.map(readAsText));
}

function joinTexts(texts, sep) {
  if (texts.length === 0) return '';
  if (sep.type === 'page') {
    // docx 端用分頁符；txt 端用 \f
    return texts.join('\f');
  }
  return texts.join(sep.value);
}

// ============================================
// 輸出：TXT
// ============================================
function buildTxt(texts, sep) {
  const body = joinTexts(texts, sep);
  // TXT 的分頁符在 Windows 記事本不顯示，但其他編輯器支援
  return new Blob([body], { type: 'text/plain;charset=utf-8' });
}

// ============================================
// 輸出：DOCX（用 JSZip 直接組出最小可用的 .docx）
// ============================================
function xmlEscape(s) {
  return String(s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&apos;');
}

function escapeXmlPreserve(s) {
  // 保留空格：xml:space="preserve"
  return xmlEscape(s);
}

function textToParagraphsXml(text, sep) {
  // 將文字切成多個 <w:p>，遇到 \n 換段落
  // 若 sep.type === 'page'，在兩個區段之間插入分頁符段落
  const sections = text.split('\f');
  const allParas = [];

  for (let s = 0; s < sections.length; s++) {
    if (s > 0) {
      // 分頁符段落
      allParas.push(`<w:p><w:r><w:br w:type="page"/></w:r></w:p>`);
    }
    const lines = sections[s].split('\n');
    for (const line of lines) {
      // 空白行也要保留為空段落
      allParas.push(
        `<w:p><w:r><w:t xml:space="preserve">${escapeXmlPreserve(line)}</w:t></w:r></w:p>`
      );
    }
  }
  return allParas.join('');
}

function buildDocx(texts, sep) {
  // 將 texts 串接後轉成段落 XML
  let bodyParasXml = '';
  for (let i = 0; i < texts.length; i++) {
    if (i > 0 && sep.type === 'page') {
      bodyParasXml += `<w:p><w:r><w:br w:type="page"/></w:r></w:p>`;
    }
    bodyParasXml += textToParagraphsXml(texts[i], sep);
    if (i < texts.length - 1 && sep.type !== 'page') {
      // 自訂分隔符：插入分隔段落（依 \n 切）
      const sepLines = sep.value.split('\n');
      for (const sl of sepLines) {
        bodyParasXml += `<w:p><w:r><w:t xml:space="preserve">${escapeXmlPreserve(sl)}</w:t></w:r></w:p>`;
      }
    }
  }

  const documentXml = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main">
  <w:body>
    ${bodyParasXml}
    <w:sectPr>
      <w:pgSz w:w="12240" w:h="15840"/>
      <w:pgMar w:top="1440" w:right="1440" w:bottom="1440" w:left="1440" w:header="720" w:footer="720" w:gutter="0"/>
    </w:sectPr>
  </w:body>
</w:document>`;

  const contentTypesXml = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">
  <Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>
  <Default Extension="xml" ContentType="application/xml"/>
  <Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/>
</Types>`;

  const relsXml = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
  <Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/>
</Relationships>`;

  const zip = new JSZip();
  zip.file('[Content_Types].xml', contentTypesXml);
  zip.folder('_rels').file('.rels', relsXml);
  zip.folder('word').file('document.xml', documentXml);
  return zip.generateAsync({ type: 'blob', mimeType: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document' });
}

// ============================================
// 合併按鈕
// ============================================
mergeBtn.addEventListener('click', async () => {
  if (files.length === 0 || mergeBtn.disabled) return;
  mergeBtn.disabled = true;
  document.querySelector('.btn-label').textContent = '合併中…';
  btnSpinner.hidden = false;
  resultCard.hidden = true;

  try {
    const sep = buildSeparator();
    const format = document.querySelector('input[name="format"]:checked').value;
    const texts = await extractAll();
    let blob, filename;
    if (format === 'txt') {
      blob = buildTxt(texts, sep);
      filename = 'merged.txt';
    } else {
      blob = await buildDocx(texts, sep);
      filename = 'merged.docx';
    }
    const url = URL.createObjectURL(blob);
    const totalSize = texts.reduce((s, t) => s + new Blob([t]).size, 0);
    resultText.innerHTML = `合併完成，共 ${files.length} 個檔案，輸出大小：<strong>${fmtSize(blob.size)}</strong>（輸入約 ${fmtSize(totalSize)}）`;
    downloadLink.href = url;
    downloadLink.download = filename;
    downloadLink.textContent = `⬇ 下載 ${filename}`;
    resultCard.hidden = false;
    toast('合併完成！', 'success');
    resultCard.scrollIntoView({ behavior: 'smooth' });
  } catch (err) {
    console.error(err);
    toast('合併失敗：' + err.message, 'error');
  } finally {
    mergeBtn.disabled = false;
    document.querySelector('.btn-label').textContent = '合併檔案';
    btnSpinner.hidden = false;
    btnSpinner.hidden = true;
  }
});

// ============================================
// 初始
// ============================================
render();

// 確認 CDN 載入
if (typeof mammoth === 'undefined') {
  toast('mammoth 載入失敗（無法解析 .docx）。請檢查網路。', 'error');
}
if (typeof JSZip === 'undefined') {
  toast('JSZip 載入失敗（無法產生 .docx）。請檢查網路。', 'error');
}
</script>
