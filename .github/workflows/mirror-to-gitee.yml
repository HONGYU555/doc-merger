name: Mirror to Gitee

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Mirror GitHub → Gitee
        uses: wearerequired/git-mirror-action@master
        env:
          API_KEY_GITHUB: ${{ secrets.GH_PAT }}
        with:
          source-repo: github.com/HONGYU555/doc-merger
          destination-repo: gitee.com/HONGYU555/doc-merger

